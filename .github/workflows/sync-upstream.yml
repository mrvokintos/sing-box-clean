name: Sync Upstream

on:
  push:
    branches: [clean]
    paths:
      - .github/workflows/sync-upstream.yml
      - .github/workflows/openwrt-a53.yml
  schedule:
    - cron: "0 4 * * *" # Runs daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      sync_official:
        description: "Sync official sagernet/sing-box"
        required: true
        type: boolean
        default: true
      sync_extended:
        description: "Sync Shtorm-7/sing-box-extended"
        required: true
        type: boolean
        default: true
      trigger_build_latest:
        description: "Rebuild the latest stable releases even if they already exist"
        required: true
        type: boolean
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Sync with Upstreams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orchestrator Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MIRROR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Official sing-box
        id: sync_official
        if: github.event_name != 'workflow_dispatch' || inputs.sync_official
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          UPSTREAM_REPO="SagerNet/sing-box"
          UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}.git"

          if [ -n "$MIRROR_TOKEN" ]; then
            git remote add upstream-official "$UPSTREAM_URL" 2>/dev/null || \
              git remote set-url upstream-official "$UPSTREAM_URL"
            git fetch --no-tags origin \
              "+refs/heads/testing:refs/remotes/origin/testing"
            git fetch --no-tags upstream-official \
              "+refs/heads/testing:refs/remotes/upstream-official/testing"
            EXPECTED_SHA=$(git rev-parse refs/remotes/origin/testing)
            git push \
              --force-with-lease="refs/heads/testing:${EXPECTED_SHA}" \
              origin \
              "refs/remotes/upstream-official/testing:refs/heads/testing"
          else
            echo "::warning::Set MIRROR_TOKEN with Contents and Workflows write permissions to update the testing mirror."
          fi

          LATEST_TAG=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')
          if [[ ! "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected official stable tag: $LATEST_TAG"
            exit 1
          fi

          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "has_new_tag=false" >> "$GITHUB_OUTPUT"
            echo "Official release $LATEST_TAG is already built."
          else
            echo "has_new_tag=true" >> "$GITHUB_OUTPUT"
            echo "New official stable release: $LATEST_TAG"
          fi

      - name: Sync sing-box-extended
        id: sync_extended
        if: >-
          always() &&
          (github.event_name != 'workflow_dispatch' || inputs.sync_extended)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          UPSTREAM_REPO="Shtorm-7/sing-box-extended"
          UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}.git"

          if [ -n "$MIRROR_TOKEN" ]; then
            git remote add upstream-extended "$UPSTREAM_URL" 2>/dev/null || \
              git remote set-url upstream-extended "$UPSTREAM_URL"
            git fetch --no-tags origin \
              "+refs/heads/extended:refs/remotes/origin/extended"
            git fetch --no-tags upstream-extended \
              "+refs/heads/extended:refs/remotes/upstream-extended/extended"
            EXPECTED_SHA=$(git rev-parse refs/remotes/origin/extended)
            git push \
              --force-with-lease="refs/heads/extended:${EXPECTED_SHA}" \
              origin \
              "refs/remotes/upstream-extended/extended:refs/heads/extended"
          else
            echo "::warning::Set MIRROR_TOKEN with Contents and Workflows write permissions to update the extended mirror."
          fi

          LATEST_TAG=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')
          if [[ ! "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-extended-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected extended stable tag: $LATEST_TAG"
            exit 1
          fi

          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "has_new_tag=false" >> "$GITHUB_OUTPUT"
            echo "Extended release $LATEST_TAG is already built."
          else
            echo "has_new_tag=true" >> "$GITHUB_OUTPUT"
            echo "New extended stable release: $LATEST_TAG"
          fi

      - name: Trigger Official Build
        if: >-
          always() &&
          (steps.sync_official.outputs.has_new_tag == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.trigger_build_latest &&
          steps.sync_official.outputs.latest_tag != ''))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.sync_official.outputs.latest_tag }}
        run: |
          set -euo pipefail
          echo "Triggering official build for $TAG_NAME"
          gh workflow run openwrt-a53.yml \
            --ref clean \
            -f tag="$TAG_NAME" \
            -f type=official

      - name: Trigger Extended Build
        if: >-
          always() &&
          (steps.sync_extended.outputs.has_new_tag == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.trigger_build_latest &&
          steps.sync_extended.outputs.latest_tag != ''))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.sync_extended.outputs.latest_tag }}
        run: |
          set -euo pipefail
          echo "Triggering extended build for $TAG_NAME"
          gh workflow run openwrt-a53.yml \
            --ref clean \
            -f tag="$TAG_NAME" \
            -f type=extended
